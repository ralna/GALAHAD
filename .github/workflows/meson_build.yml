jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Meson and Ninja
        shell: bash
        run: |
          pip install meson
          pip install ninja numpy

      - name: Set the environment variables
        shell: bash
        run: |
          echo "GALAHAD=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "DEPS=$GITHUB_WORKSPACE/.." >> $GITHUB_ENV
          echo "CUTEST=$GITHUB_WORKSPACE/../CUTEst" >> $GITHUB_ENV
          if [[ "${{ inputs.os }}" == "ubuntu-24.04-arm" ]]; then
            echo "LIBDIR=lib" >> $GITHUB_ENV
            echo "DLEXT=so" >> $GITHUB_ENV
            echo "PLATFORM=aarch64-linux-gnu" >> $GITHUB_ENV
            echo "JULIA_GALAHAD_LIBRARY_PATH=$GITHUB_WORKSPACE/galahad/lib" >> $GITHUB_ENV
          fi
          if [[ "${{ inputs.os }}" == "self-hosted" ]]; then
            echo "LIBDIR=lib" >> $GITHUB_ENV
            echo "DLEXT=so" >> $GITHUB_ENV
            echo "PLATFORM=x86_64-linux-gnu" >> $GITHUB_ENV
          fi
          if [[ "${{ inputs.os }}" == "ubuntu-latest" ]]; then
            echo "LIBDIR=lib" >> $GITHUB_ENV
            echo "DLEXT=so" >> $GITHUB_ENV
            echo "PLATFORM=x86_64-linux-gnu" >> $GITHUB_ENV
            echo "JULIA_GALAHAD_LIBRARY_PATH=$GITHUB_WORKSPACE/galahad/lib" >> $GITHUB_ENV
          fi
          if [[ "${{inputs.os}}" == "macos-15-intel" ]]; then
            echo "LIBDIR=lib" >> $GITHUB_ENV
            echo "DLEXT=dylib" >> $GITHUB_ENV
            echo "PLATFORM=x86_64-apple-darwin" >> $GITHUB_ENV
            echo "JULIA_GALAHAD_LIBRARY_PATH=$GITHUB_WORKSPACE/galahad/lib" >> $GITHUB_ENV
          fi
          if [[ "${{inputs.os}}" == "macos-latest" ]]; then
            echo "LIBDIR=lib" >> $GITHUB_ENV
            echo "DLEXT=dylib" >> $GITHUB_ENV
            echo "PLATFORM=aarch64-apple-darwin" >> $GITHUB_ENV
            echo "JULIA_GALAHAD_LIBRARY_PATH=$GITHUB_WORKSPACE/galahad/lib" >> $GITHUB_ENV
          fi
          if [[ "${{ inputs.os }}" == "windows-latest" ]]; then
            echo "LIBDIR=bin" >> $GITHUB_ENV
            echo "DLEXT=dll" >> $GITHUB_ENV
            echo "PLATFORM=x86_64-w64-mingw32" >> $GITHUB_ENV
            echo "JULIA_GALAHAD_LIBRARY_PATH=$GITHUB_WORKSPACE/galahad/bin" >> $GITHUB_ENV
            choco install wget
          fi

      - name: Set the environment variables LIBRARY_PATH, LD_LIBRARY_PATH and DYLD_LIBRARY_PATH
        shell: bash
        run: |
          if [[ "${{ inputs.os }}" == "self-hosted" ]]; then
            echo "LIBRARY_PATH=$LIBRARY_PATH:$DEPS/deps/$LIBDIR:/scratch/github-actions/actions_runner_galahad/lib:$GITHUB_WORKSPACE/galahad/lib:$GITHUB_WORKSPACE/../deps/lib:$GITHUB_WORKSPACE/../CUTEst/lib" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$DEPS/deps/$LIBDIR:/scratch/github-actions/actions_runner_galahad/lib:$GITHUB_WORKSPACE/galahad/lib:$GITHUB_WORKSPACE/../deps/lib:$GITHUB_WORKSPACE/../CUTEst/lib" >> $GITHUB_ENV
          fi
          if [[ "${{ inputs.os }}" == "ubuntu-latest" || "${{ inputs.os }}" == "ubuntu-24.04-arm" ]]; then
            echo "LIBRARY_PATH=$LIBRARY_PATH:$GITHUB_WORKSPACE/galahad/lib:$GITHUB_WORKSPACE/../deps/lib:$GITHUB_WORKSPACE/../CUTEst/lib" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$GITHUB_WORKSPACE/galahad/lib:$GITHUB_WORKSPACE/../deps/lib:$GITHUB_WORKSPACE/../CUTEst/lib" >> $GITHUB_ENV
          fi
          if [[ "${{ inputs.os }}" == "macos-15-intel" || "${{inputs.os}}" == "macos-latest" ]]; then
            echo "LIBRARY_PATH=$LIBRARY_PATH:$GITHUB_WORKSPACE/galahad/lib:$GITHUB_WORKSPACE/../deps/lib:$GITHUB_WORKSPACE/../CUTEst/lib" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$GITHUB_WORKSPACE/galahad/lib:$GITHUB_WORKSPACE/../deps/lib:$GITHUB_WORKSPACE/../CUTEst/lib" >> $GITHUB_ENV
            echo "DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:$GITHUB_WORKSPACE/galahad/lib:$GITHUB_WORKSPACE/../deps/lib:$GITHUB_WORKSPACE/../CUTEst/lib" >> $GITHUB_ENV
            echo "DYLD_FALLBACK_LIBRARY_PATH=$DYLD_FALLBACK_LIBRARY_PATH:$GITHUB_WORKSPACE/../CUTEst/lib" >> $GITHUB_ENV
          fi
          if [[ "${{ inputs.os }}" == "windows-latest" ]]; then
            echo "$GITHUB_WORKSPACE/../deps/bin" >> "$GITHUB_PATH"
            echo "$GITHUB_WORKSPACE/../CUTEst/bin" >> "$GITHUB_PATH"
            echo "$GITHUB_WORKSPACE/galahad/bin" >> "$GITHUB_PATH"
          fi

      - name: Set environment variables for OpenMP
        shell: bash
        run: |
          echo "OMP_CANCELLATION=TRUE" >> $GITHUB_ENV
          echo "OMP_PROC_BIND=TRUE" >> $GITHUB_ENV
          if [[ "${{ inputs.os }}" == "macos-15-intel" || "${{ inputs.os }}" == "macos-latest" ]]; then
            echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV
            echo "OPENBLAS_NUM_THREADS=1" >> $GITHUB_ENV
          fi

      # PaStiX / SPM / SCOTCH leak internal and one-time global allocations
      # that LeakSanitizer would flag (aborting every test that touches PaStiX);
      # point LSan at a suppression file that ignores those third-party leaks.
      - name: Set LeakSanitizer suppressions for third-party solvers
        if: inputs.sanitizers == 'true'
        shell: bash
        run: |
          echo "LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/.github/lsan_suppressions.txt" >> $GITHUB_ENV

      # Exercise the chosen symmetric and definite linear solvers under the sanitizers.
      - name: Select the linear solvers exercised by the tests
        if: inputs.sanitizers == 'true'
        shell: bash
        run: |
          if [[ -n "${{ inputs.symmetric_solver }}" ]]; then
            echo "GALAHAD_SYMMETRIC_LINEAR_SOLVER=${{ inputs.symmetric_solver }}" >> $GITHUB_ENV
          fi
          if [[ -n "${{ inputs.definite_solver }}" ]]; then
            echo "GALAHAD_DEFINITE_LINEAR_SOLVER=${{ inputs.definite_solver }}" >> $GITHUB_ENV
          fi

      - name: Set environment variables for self-hosted runner
        if: inputs.os == 'self-hosted'
        shell: bash
        run: |
          echo "CUDA_VISIBLE_DEVICES=1" >> $GITHUB_ENV
          echo "JULIA_DEPOT_PATH=/scratch/github-actions/julia_depot_galahad" >> $GITHUB_ENV
          echo "JULIA_GALAHAD_LIBRARY_PATH=/scratch/github-actions/actions_runner_galahad/_work/GALAHAD/GALAHAD/galahad/lib" >> $GITHUB_ENV

      - name: Install compilers
        if: inputs.os != 'self-hosted'
        uses: fortran-lang/setup-fortran@main
        with:
          compiler: ${{ inputs.compiler }}
          version: ${{ inputs.version }}

      - name: Install CUTEst
        if: inputs.os != 'windows-latest' && inputs.compiler != 'nvidia-hpc'
        shell: bash
        run: |
          VERSION_CUTEST="2.6.0"
          INT64="false"
          if [[ "${{ inputs.int }}" == "64" ]]; then
            INT64="true"
          fi
          QUADRUPLE="true"
          if [[ "${{ inputs.os }}" == "ubuntu-24.04-arm" || "${{ inputs.compiler }}" == "nvidia-hpc" || "${{ inputs.compiler }}" == "intel" ]]; then
            QUADRUPLE="false"
          fi
          cd ..
          if [[ "${{ inputs.os }}" == "windows-latest" ]]; then
            wget https://github.com/ralna/CUTEst/archive/refs/tags/v${VERSION_CUTEST}.zip
            unzip v${VERSION_CUTEST}.zip
          else
            wget https://github.com/ralna/CUTEst/archive/refs/tags/v${VERSION_CUTEST}.tar.gz
            tar -xzvf v${VERSION_CUTEST}.tar.gz
          fi
          cd CUTEst-${VERSION_CUTEST}
          rm -rf builddir
          meson setup builddir --buildtype=debug \
                               --prefix=$CUTEST \
                               -Ddefault_library=shared \
                               -Dquadruple=${QUADRUPLE} \
                               -Dtests=false \
                               -Dint64=${INT64}
          meson compile -C builddir
          meson install -C builddir

      - name: Install libHSL
        if: inputs.os != 'windows-latest'
        shell: bash
        run: |
          # self-hosted runner
          if [[ "$HOSTNAME" == "moonshot" ]]; then
            cp /scratch/github-actions/actions_runner_galahad/lib/* $DEPS/deps/$LIBDIR
            if [[ "${{ inputs.int }}" == "64" ]]; then
              INT64="true"
              INDEX64="ON"
            else
              INT64="false"
              INDEX64="OFF"
            fi
            BLAS="blas"
            LAPACK="lapack"
            cd /scratch/github-actions/actions_runner_galahad/lapack
            rm -rf builddir
            mkdir builddir && cd builddir
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DBUILD_INDEX64_EXT_API=${INDEX64} \
              -DTEST_FORTRAN_COMPILER=OFF
            make -j4
            BLAS_PATH="/scratch/github-actions/actions_runner_galahad/lapack/builddir/lib"
            LAPACK_PATH="/scratch/github-actions/actions_runner_galahad/lapack/builddir/lib"
            cd /scratch/github-actions/actions_runner_galahad/hsl_subset
            rm -rf builddir
            meson setup builddir --buildtype=debug \
                                 --prefix=$DEPS/deps \
                                 -Dlibblas=${BLAS} \
                                 -Dliblapack=${LAPACK} \
                                 -Dlibblas_path=${BLAS_PATH} \
                                 -Dliblapack_path=${LAPACK_PATH} \
                                 -Dquadruple=true \
                                 -Ddefault_library=shared \
                                 -Dint64=${INT64}
            meson compile -C builddir
            meson install -C builddir
          else
            VERSION_LIBHSL="4.0.6"
            cd ..
            if [[ "${{ inputs.os }}" == "windows-latest" ]]; then
              wget https://github.com/ralna/libHSL/archive/refs/tags/v${VERSION_LIBHSL}.zip
              unzip v${VERSION_LIBHSL}.zip
            else
              wget https://github.com/ralna/libHSL/archive/refs/tags/v${VERSION_LIBHSL}.tar.gz
              tar -xzvf v${VERSION_LIBHSL}.tar.gz
            fi
            QUADRUPLE="true"
            if [[ "${{ inputs.os }}" == "ubuntu-24.04-arm" || "${{ inputs.compiler }}" == "nvidia-hpc" || "${{ inputs.compiler }}" == "intel" ]]; then
              QUADRUPLE="false"
            fi
            cd libHSL-${VERSION_LIBHSL}/hsl_subset
            meson setup builddir --buildtype=debug \
                                 --prefix=$DEPS/deps \
                                 -Dquadruple=${QUADRUPLE} \
                                 -Ddefault_library=shared
            meson compile -C builddir
            meson install -C builddir
          fi

      - name: Install METIS / SCOTCH / PaStiX / MUMPS build dependencies
        if: inputs.compiler == 'gcc' && inputs.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p "$DEPS/deps"
          if [[ "${{ inputs.int }}" == "64" ]]; then
            echo "IDX=64" >> $GITHUB_ENV
            echo "PASTIX_INT64=ON" >> $GITHUB_ENV
          else
            echo "IDX=32" >> $GITHUB_ENV
            echo "PASTIX_INT64=OFF" >> $GITHUB_ENV
          fi
          if [[ "${{ inputs.os }}" == "ubuntu-latest" || "${{ inputs.os }}" == "ubuntu-24.04-arm" ]]; then
            sudo apt-get -y install libhwloc-dev libopenblas-dev liblapacke-dev bison flex
          elif [[ "${{ inputs.os }}" == "macos-15-intel" || "${{ inputs.os }}" == "macos-latest" ]]; then
            brew install hwloc openblas bison flex
            # brew's bison/flex are keg-only (SCOTCH needs a recent bison/flex) and
            # OpenBLAS/hwloc are keg-only too; expose them to the later build steps
            echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
            echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
            echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas):$(brew --prefix hwloc):${CMAKE_PREFIX_PATH}" >> $GITHUB_ENV
          fi

      - name: Install METIS
        if: inputs.compiler == 'gcc' && inputs.os != 'windows-latest'
        shell: bash
        run: |
          VERSION_METIS="5.1.0"
          cd "$DEPS"
          git clone --depth 1 --branch v${VERSION_METIS} https://github.com/amontoison/METIS.git metis
          cd metis
          sed -i.bak "s/#define IDXTYPEWIDTH 32/#define IDXTYPEWIDTH ${IDX}/" include/metis.h
          mkdir build
          cd build
          cmake .. \
            -DGKLIB_PATH=$(pwd)/../GKlib \
            -DSHARED=1 \
            -DCMAKE_INSTALL_PREFIX=$DEPS/deps \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_FLAGS="-Wno-implicit-function-declaration -Wno-implicit-int"
          make -j4
          make install

      - name: Install SCOTCH
        if: inputs.compiler == 'gcc' && inputs.os != 'windows-latest'
        shell: bash
        run: |
          VERSION_SCOTCH="7.0.12"
          cd "$DEPS"
          git clone --depth 1 --branch v${VERSION_SCOTCH} https://gitlab.inria.fr/scotch/scotch.git scotch
          cd scotch
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DINTSIZE=${IDX} \
            -DBUILD_PTSCOTCH=OFF \
            -DBUILD_LIBESMUMPS=ON \
            -DBUILD_LIBSCOTCHMETIS=OFF \
            -DCMAKE_INSTALL_PREFIX=$DEPS/deps \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make -j4
          make install

      - name: Install PaStiX
        if: inputs.compiler == 'gcc' && inputs.os != 'windows-latest'
        shell: bash
        run: |
          VERSION_PASTIX="6.4.0"
          # METIS and SCOTCH orderings are both built above, so exercise both in
          # the pastixt self-test (0 = Scotch, 1 = Metis)
          echo "GALAHAD_PASTIX_ORDERINGS=0 1" >> $GITHUB_ENV
          cd "$DEPS"
          git clone --depth 1 --branch v${VERSION_PASTIX} https://gitlab.inria.fr/solverstack/pastix.git
          cd pastix
          git submodule update --init --recursive
          mkdir build
          cd build
          cmake .. \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_DOCUMENTATION=OFF \
            -DCMAKE_INSTALL_PREFIX=$DEPS/deps \
            -DCMAKE_PREFIX_PATH=$DEPS/deps \
            -DMETIS_DIR=$DEPS/deps \
            -DSCOTCH_DIR=$DEPS/deps \
            -DCMAKE_BUILD_TYPE=Release \
            -DPASTIX_INT64=${PASTIX_INT64} \
            -DPASTIX_ORDERING_SCOTCH=ON \
            -DPASTIX_ORDERING_METIS=ON
          make -j4
          make install

      - name: Install MUMPS
        if: inputs.compiler == 'gcc' && inputs.os != 'windows-latest' && inputs.int == '32'
        shell: bash
        run: |
          VERSION_MUMPS="5.9.0"
          cd "$DEPS"
          wget -q https://mumps-solver.org/MUMPS_${VERSION_MUMPS}.tar.gz
          tar -xzf MUMPS_${VERSION_MUMPS}.tar.gz
          cd MUMPS_${VERSION_MUMPS}
          cp Make.inc/Makefile.G95.SEQ Makefile.inc

          # add -fallow-argument-mismatch when the compiler supports it (gfortran >= 10)
          : > empty.f
          FFLAGS=""
          if gfortran -c -fallow-argument-mismatch empty.f >/dev/null 2>&1; then
            FFLAGS="-fallow-argument-mismatch"
          fi
          rm -f empty.*

          # SONAME flag and the BLAS/LAPACK location differ per OS
          if [[ "${{ inputs.os }}" == "macos-15-intel" || "${{ inputs.os }}" == "macos-latest" ]]; then
            SONAME="-install_name"
            BLAS_LAPACK="-L$(brew --prefix openblas)/lib -lopenblas"
          else
            SONAME="-soname"
            BLAS_LAPACK="-lopenblas"
          fi

          make -j4 allshared \
            OPTF="-O3" \
            OPTL="-O3" \
            OPTC="-O3" \
            CDEFS=-DAdd_ \
            LMETISDIR="$DEPS/deps/lib" \
            IMETIS="-I$DEPS/deps/include" \
            LMETIS="-L$DEPS/deps/lib -lmetis" \
            SCOTCHDIR="$DEPS/deps" \
            ISCOTCH="-I$DEPS/deps/include" \
            LSCOTCH="-L$DEPS/deps/lib -lesmumps -lscotch -lscotcherr" \
            ORDERINGSF="-Dpord -Dmetis -Dscotch" \
            LIBEXT_SHARED=".${DLEXT}" \
            SHARED_OPT="-shared" \
            SONAME="${SONAME}" \
            CC="${CC:-gcc}" \
            FC="gfortran ${FFLAGS}" \
            FL="gfortran" \
            RANLIB="echo" \
            LIBBLAS="${BLAS_LAPACK}" \
            LAPACK="${BLAS_LAPACK}"

          # install the headers and shared libraries into $DEPS/deps
          mkdir -p "$DEPS/deps/include/libseq"
          cp include/*.h "$DEPS/deps/include"
          cp libseq/*.h "$DEPS/deps/include/libseq"
          cp lib/*.${DLEXT} "$DEPS/deps/lib"
          cp libseq/*.${DLEXT} "$DEPS/deps/lib" 2>/dev/null || true

      - name: Install MKL
        if: inputs.os == 'ubuntu-latest' && inputs.compiler == 'intel'
        shell: bash
        run: |
          cd ..
          mkdir -p deps
          VERSION_MKL="2025.2.0"
          wget https://github.com/JuliaBinaryWrappers/MKL_jll.jl/releases/download/MKL-v${VERSION_MKL}%2B0/MKL.v${VERSION_MKL}.$PLATFORM.tar.gz
          tar -xzvf MKL.v${VERSION_MKL}.$PLATFORM.tar.gz -C deps
          # wget https://github.com/JuliaBinaryWrappers/IntelOpenMP_jll.jl/releases/download/IntelOpenMP-v${VERSION_MKL}%2B0/IntelOpenMP.v${VERSION_MKL}.$PLATFORM.tar.gz
          # tar -xzvf IntelOpenMP.v${VERSION_MKL}.$PLATFORM.tar.gz -C deps

      - name: Install ASL
        if: inputs.os != 'windows-latest'
        shell: bash
        run: |
          cd ..
          mkdir -p deps
          VERSION_ASL="0.1.3"
          wget https://github.com/JuliaBinaryWrappers/ASL_jll.jl/releases/download/ASL-v${VERSION_ASL}%2B0/ASL.v${VERSION_ASL}.$PLATFORM.tar.gz
          tar -xzvf ASL.v${VERSION_ASL}.$PLATFORM.tar.gz -C deps

      - name: Setup GALAHAD
        shell: bash
        run: |
          mkdir -p ../deps/${LIBDIR}
          mkdir -p ../deps/modules
          mkdir -p ../deps/include
          mkdir -p ../CUTEst/modules
          CSTD="c99"
          CPPSTD="c++11"
          INT64="false"
          QUADRUPLE="true"
          SSIDS="true"
          BLAS=""
          LAPACK=""
          BLAS_PATH="$DEPS/deps/$LIBDIR"
          LAPACK_PATH="$DEPS/deps/$LIBDIR"
          PYTHON_INTERFACE="true"
          SHARED_STATIC="shared"
          CUTEST_SINGLE="cutest_single"
          CUTEST_DOUBLE="cutest_double"
          CUTEST_QUADRUPLE="cutest_quadruple"
          MUMPS_SINGLE="smumps"
          MUMPS_DOUBLE="dmumps"
          HSL="hsl_subset"
          HSL_PATH="$DEPS/deps/$LIBDIR"
          ASL="asl"
          ASL_PATH="$DEPS/deps/$LIBDIR"
