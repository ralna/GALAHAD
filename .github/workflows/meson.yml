name: Meson
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Windows / MSVC runtime: Intel compilers are MSVC-ABI, so this is the build
  # that can host the MSVC-ABI CPython extension modules. Python tests only.
  windows-intel-build:
    name: ${{ matrix.os }}/${{ matrix.compiler }}-v${{ matrix.version }}/${{ matrix.runtime }}/Int${{ matrix.int }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest']
        arch: ['x64']
        compiler: ['intel']
        version: ['2026.1']
        runtime: ['msvc']
        int: ['32', '64']
        sanitizers: ['false']
    uses: ./.github/workflows/meson_build.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      version: ${{ matrix.version }}
      runtime: ${{ matrix.runtime }}
      int: ${{ matrix.int }}
      sanitizers: ${{ matrix.sanitizers }}

  # Windows / MinGW runtime: built inside MSYS2/UCRT64 with gfortran. This is
  # the ABI Julia uses on Windows, so this is the build GALAHAD.jl is tested
  # against. Julia tests only.
  windows-gcc-build:
    name: ${{ matrix.os }}/${{ matrix.compiler }}-v${{ matrix.version }}/${{ matrix.runtime }}/Int${{ matrix.int }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest']
        arch: ['x64']
        compiler: ['gcc']
        version: ['11']
        runtime: ['mingw']
        int: ['32', '64']
        sanitizers: ['false']
    uses: ./.github/workflows/meson_build.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      version: ${{ matrix.version }}
      runtime: ${{ matrix.runtime }}
      int: ${{ matrix.int }}
      sanitizers: ${{ matrix.sanitizers }}

