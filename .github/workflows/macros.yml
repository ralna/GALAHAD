name: Macros
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
# Cancel the runs for a pull request that are superseded by a newer push to
# it (runs for pushes to master are never cancelled: each has its own group)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: GALAHAD -- Check macros
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GALAHAD
        uses: actions/checkout@v4
      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: 1
          arch: x64
      - name: Check the Fortran macros
        run: julia --color=no .github/julia/check_macros.jl
