name: Sanitizers
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sanitizers-linux-build:
    name: Int${{ matrix.int }} - SLS=${{ matrix.solver.sls }} / DLS=${{ matrix.solver.dls }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        arch: ['x64']
        compiler: ['gcc']
        version: ['14']
        int: ['32', '64']
        sanitizers: ['true']
        # Each entry selects the symmetric (indefinite) solver `sls` and the
        # definite solver `dls` exercised by the test drivers at run time.
        solver:
          - { sls: 'sytr',   dls: 'potr'   }   # LAPACK dense (default fallback)
          - { sls: 'sytr',   dls: 'pbtr'   }   # LAPACK banded (definite)
          - { sls: 'ssids',  dls: 'ssids'  }   # embedded SPRAL SSIDS
          - { sls: 'mumps',  dls: 'mumps'  }   # MUMPS
          - { sls: 'pastix', dls: 'pastix' }   # PaStiX
          # - { sls: 'sils',   dls: 'sils'   }   # HSL MA27
          # - { sls: 'ma57',   dls: 'ma57'   }   # HSL MA57
          # - { sls: 'ma77',   dls: 'ma77'   }   # HSL MA77 (out-of-core)
          # - { sls: 'ma86',   dls: 'ma86'   }   # HSL MA86
          # - { sls: 'ma97',   dls: 'ma97'   }   # HSL MA97
          # - { sls: 'sytr',   dls: 'ma87'   }   # HSL MA87 (definite only)
    uses: ./.github/workflows/meson_build.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      version: ${{ matrix.version }}
      int: ${{ matrix.int }}
      sanitizers: ${{ matrix.sanitizers }}
      symmetric_solver: ${{ matrix.solver.sls }}
      definite_solver: ${{ matrix.solver.dls }}
