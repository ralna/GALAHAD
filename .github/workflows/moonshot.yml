name: Moonshot
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel the runs for a pull request that are superseded by a newer push to
# it (runs for pushes to master are never cancelled: each has its own group)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-moonshot-hsl:
    name: ${{ matrix.os }}/${{ matrix.compiler }}-v${{ matrix.version }}/Int${{ matrix.int }}
    strategy:
      fail-fast: false
      matrix:
        os: ['self-hosted']
        arch: ['x64']
        compiler: ['gcc']
        version: ['13']
        int: ['32', '64']
        sanitizers: ['false']
    uses: ./.github/workflows/meson_build.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      version: ${{ matrix.version }}
      int: ${{ matrix.int }}
      sanitizers: ${{ matrix.sanitizers }}
