name: Moonshot
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-moonshot-hsl:
    name: ${{ matrix.os }}/${{ matrix.compiler }}-v${{ matrix.version }}/Int${{ matrix.int }}
    strategy:
      fail-fast: false
      matrix:
        os: ['self-hosted']
        arch: ['x64']
        compiler: ['gcc']
        version: ['13']
        int: ['32', '64']
        sanitizers: ['false']
    uses: ./.github/workflows/meson_build.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      version: ${{ matrix.version }}
      int: ${{ matrix.int }}
      sanitizers: ${{ matrix.sanitizers }}
