name: Build and upload to PyPI

# Publish when a new GitHub version is tagged:
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check_pypi:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - id: check
        run: |
          # If this is a pull request, skip the PyPI check and force a build
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request detected: skipping PyPI check and forcing build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise check if version tag already exists on PyPI
          VERSION="${GITHUB_REF_NAME#v}"

          if curl -fsSL https://pypi.org/pypi/galahad-optrove/json | \
             jq -e ".releases[\"$VERSION\"]" > /dev/null; then
            echo "Version $VERSION already exists on PyPI"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not found on PyPI"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build_wheels:
    needs: check_pypi
    if: needs.check_pypi.outputs.should_build == 'true'
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: ${{ github.event_name != 'pull_request' }}
      matrix:
        # Note: builds on these are backward compatible
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d '.' -f 1-2)" >> $GITHUB_ENV

      - name: Set macOS OpenBLAS paths
        if: runner.os == 'macOS'
        run: |
          if [[ "${{matrix.os}}" == "macos-15" ]]; then
            echo PKG_CONFIG_PATH="/opt/homebrew/opt/openblas/lib/pkgconfig" >> $GITHUB_ENV
          fi
          if [[ "${{matrix.os}}" == "macos-15-intel" ]]; then
            echo PKG_CONFIG_PATH="/usr/local/opt/openblas/lib/pkgconfig" >> $GITHUB_ENV
          fi

      - name: Prepare test scripts
        shell: python
        run: |
          import shutil, glob, os
          os.makedirs("tests", exist_ok=True)
          for f in glob.glob("src/**/test_*.py", recursive=True):
              shutil.copy(f, "tests")

      - name: Build wheels
        run: pipx run cibuildwheel==4.2.1
        # to supply options, put them in 'env', like:
        # env:
        #   CIBW_SOME_OPTION: value
        env:
          # list of python versions and platforms to build on
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp314-*' || 'cp3{10,11,12,13,14}-*' }}
          # skip builds on unsupported platforms (free-threaded, 32-bit, and musllinux)
          CIBW_SKIP: "*t-win* *-win32 *-manylinux_i686 *musllinux*"

          # set OpenMP variables on Linux and Windows
          CIBW_ENVIRONMENT: OMP_CANCELLATION=true OMP_PROC_BIND=true

          # build with gcc/gfortran on macOS and set OpenMP variables on macOS
          CIBW_ENVIRONMENT_MACOS: CC="gcc-14" CXX="g++-14" FC="gfortran-14" OMP_CANCELLATION=true OMP_PROC_BIND=true

          # build with OpenBLAS
          CIBW_BEFORE_ALL_LINUX: yum install -y openblas-devel
          CIBW_BEFORE_ALL_MACOS: brew install openblas

          # cibuildwheel doesn't yet ship a default repair command for Windows
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --ignore-existing -w {dest_dir} {wheel}"

          # test built wheels
          CIBW_TEST_REQUIRES: numpy pytest
          CIBW_TEST_SOURCES: conftest.py tests
          CIBW_TEST_COMMAND: pytest -v --capture=no --tb=short -rN -p no:faulthandler -o python_files=no

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    needs: check_pypi
    if: github.event_name != 'pull_request' && needs.check_pypi.outputs.should_build == 'true'
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [check_pypi, build_wheels, build_sdist]
    if: github.event_name != 'pull_request' && needs.check_pypi.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
